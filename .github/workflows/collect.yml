name: collect
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: |
          M=$(date -u +%M)
          if [ $((10#$M % 15)) -lt 5 ]; then python3 collect.py --calls; else python3 collect.py; fi
      - name: Save
        run: |
          git config user.name "sushiro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "snapshot $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
